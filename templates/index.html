<!DOCTYPE html><html dir=rtl lang=ar><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ULTRA 10B 3 LINKS</title>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:12px}h1{color:gold;text-align:center;font-size:18px}.card{background:#111;border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0}select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:3px 0}button{background:linear-gradient(90deg,gold,red);color:#000;font-weight:900;cursor:pointer}pre{background:#000;padding:8px;border-radius:6px;white-space:pre-wrap;font-size:11px;max-height:500px;overflow:auto}.badge{background:#222;border:1px solid gold;padding:3px 6px;border-radius:10px;font-size:10px;margin:2px;display:inline-block}</style></head><body>
<h1>💀 SULEIMANI ULTRA 10B<br>3 لينكات فيديو + 6 وصف - VIP</h1>
<div class=card><span class=badge>VIP</span><span class=badge>10B%</span><span class=badge>3 VIDEO LINKS</span><span class=badge>6 DESC LINKS</span><span class=badge>19 دولة</span></div>
<div class=card><label>🩺 المرض:</label><select id=dis><option value=colon>القولون CTR 22%</option><option value=sugar>السكر</option><option value=pressure>الضغط</option></select><label>🌍 الدولة:</label><select id=cnt><option value=egypt>مصر</option><option value=usa>امريكا</option><option value=germany>المانيا</option><option value=france>فرنسا/سويسرا/كندا</option></select><button onclick=gen()>🔓 ولد 3 لينكات فيديو + 6 وصف 10B</button></div>
<div class=card id=res style=display:none><h3 style=color:gold>✅ اتولد:</h3><pre id=out></pre><button onclick="navigator.clipboard.writeText(document.getElementById('out').textContent);alert('اتنسخ VIP')">📋 نسخ الكل</button><button onclick="let j=JSON.parse(document.getElementById('out').textContent);navigator.clipboard.writeText(j.description);alert('وصف الفيديو 3+6 اتنسخ')">📋 نسخ وصف الفيديو فقط</button></div>
<script>async function gen(){let r=await fetch('/api/ultra?disease='+document.getElementById('dis').value);let j=await r.json();document.getElementById('out').textContent=JSON.stringify(j,null,2);document.getElementById('res').style.display='block';}</script>
</body></html>
