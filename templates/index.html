<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 الخليفة السيبراني v35.0 FINAL FIXED</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif}
        body{background:#05080f;color:#e0e6f0;padding:15px;min-height:100vh}
        .container{max-width:1250px;margin:auto;background:linear-gradient(145deg,#111b2e,#0a1220);border-radius:28px;padding:28px;border:1px solid #00d2ff33;box-shadow:0 0 100px #00d2ff0f}
        h1{font-size:2.4rem;background:linear-gradient(135deg,#f7b733,#fc4a1a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;font-weight:900}
        .subtitle{text-align:center;opacity:.6;margin-bottom:18px}
        .badge{background:#00d2ff1a;border:1px solid #00d2ff66;border-radius:20px;padding:3px 12px;color:#00d2ff;font-size:.75rem}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
        .card{background:#0a111f;border-radius:20px;padding:18px;border:1px solid #1e2d4a;position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;top:0;right:0;width:100%;height:2px;background:linear-gradient(90deg,#f7b733,#00d2ff)}
        .card h3{color:#fff;border-bottom:1px solid #1a2a4a;padding-bottom:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
        .key-row{display:flex;justify-content:space-between;align-items:center;background:#050a15;padding:10px 14px;border-radius:12px;margin-bottom:9px;border-right:3px solid #f7b733}
        .key-row input{background:transparent;border:none;color:#a0b4c8;direction:ltr;width:68%;font-family:monospace;font-size:.85rem}
        .key-row input:focus{outline:none;color:#fff}
        .btn-icon{background:none;border:none;color:#7b8ba3;cursor:pointer;font-size:1.1rem}
        .btn-primary{background:linear-gradient(135deg,#f7b733,#fc4a1a);border:none;color:#fff;padding:11px 26px;border-radius:40px;font-weight:700;cursor:pointer}
        .btn-secondary{background:transparent;border:1px solid #00d2ff55;color:#00d2ff;padding:9px 16px;border-radius:40px;cursor:pointer;font-size:.85rem}
        .log-area{background:#050a15;padding:14px;border-radius:14px;height:280px;overflow-y:auto;font-family:monospace;font-size:.78rem;border:1px solid #1e2d4a;line-height:1.7}
        .affiliate-box{background:linear-gradient(135deg,#1a2a4a,#162040);border:1px solid #f7b73344;border-radius:16px;padding:14px;margin-top:18px;text-align:center;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
        .affiliate-box a{color:#f7b733;text-decoration:none;font-weight:800;direction:ltr}
        .flex{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .stat{font-size:1.6rem;font-weight:900;color:#f7b733}
        @media(max-width:850px){.grid-2{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="container">
    <h1>🧬 الخليفة السيبراني <span class="badge">v35.0 FINAL FIXED</span></h1>
    <p class="subtitle">تم إصلاح زرار اختبار الاتصال</p>
    <div class="card">
        <h3>🔑 المفاتيح الثلاثة - يوتيوب OAuth <span class="badge">تم الإصلاح ✅</span></h3>
        <div class="key-row"><span>📊 معرف العميل</span><input type="password" id="client_id" placeholder="YOUR_CLIENT_ID"><button class="btn-icon" onclick="toggleKey('client_id')">👁️</button></div>
        <div class="key-row"><span>🔐 سِر العميل</span><input type="password" id="client_secret" placeholder="YOUR_CLIENT_SECRET"><button class="btn-icon" onclick="toggleKey('client_secret')">👁️</button></div>
        <div class="key-row"><span>♻️ توكن التحديث</span><input type="password" id="refresh_token" placeholder="YOUR_REFRESH_TOKEN"><button class="btn-icon" onclick="toggleKey('refresh_token')">👁️</button></div>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn-primary" onclick="saveKeys()">💾 حفظ وتشفير فوري</button>
            <button class="btn-secondary" onclick="testConnection()">⚡ اختبار الاتصال</button>
        </div>
    </div>
    <div class="card" style="margin-top:18px;">
        <h3>📋 سجل عمليات الخليفة - لحظي</h3>
        <div class="log-area" id="logArea"></div>
    </div>
</div>
<script>
    const socket = io();
    socket.on('log', data=>{
        const log = document.getElementById('logArea');
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${data.msg}`;
        if(data.highlight) div.style.color = '#f7b733';
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    });
    function toggleKey(id){ const el=document.getElementById(id); el.type = el.type==='password'?'text':'password'; }
    function addLog(msg,hl){ const log=document.getElementById('logArea'); const d=document.createElement('div'); d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`; if(hl) d.style.color='#f7b733'; log.appendChild(d); log.scrollTop=log.scrollHeight; }
    function saveKeys(){ socket.emit('save_keys',{client_id:document.getElementById('client_id').value, client_secret:document.getElementById('client_secret').value, refresh_token:document.getElementById('refresh_token').value}); }
    function testConnection(){
        const cid = document.getElementById('client_id').value.trim();
        const cs = document.getElementById('client_secret').value.trim();
        const rt = document.getElementById('refresh_token').value.trim();
        if(!cid || !cs || !rt){ addLog('❌ املأ الثلاث خانات!',true); alert('املأ الثلاث خانات!'); return; }
        addLog('⚡ إرسال المفاتيح للاختبار...',true);
        socket.emit('test_connection',{client_id: cid, client_secret: cs, refresh_token: rt});
    }
    function generateVideo(t){ socket.emit('generate_video',{template:t}); }
    function runSimulation(){ socket.emit('run_simulation'); }
</script>
</body>
</html>
