      - key: TOPIC_NEW
        value: "طيبات الدكتور ضياء العوضى - نظام الطيبات - المسموح والممنوع - خبز قمح كامل - توست - بقسماط - أرز - بطاطس - لحوم - كبدة - جمبري - بيض - زبدة - قشطة - فواكه مسموحة - الممنوعات: دجاج - لبن - زبادي - خضار - بقوليات - علاج طبيعي بدون أدوية - قصص شفاء حقيقية - وجبات يومية - v113 - حذف جميع المواضيع"
      - key: FLOW_GOOGLE
        value: "true - دمج اداة فلو من جوجل لإنشاء الصور - Flow Google - Imagen 3 + Veo 3 + Gemini - labs.google/flow - طيبات الدكتور ضياء العوضى - إنشاء صور أكل صحي - خبز - لحوم - فواكه - نظام الطيبات - 21 دولة + ترجمة + صوت + دبلجة - ربط قناتي - التشغيل علي n8n وعدم الربط - 0.000000000001s"
      - key: NO_N8N_INTERNAL
        value: "true - التشغيل علي n8n وعدم الربط - لا يوجد ربط داخلي - standalone - ربط قناتي فقط - YouTube Data API v3 - حقيقي - طيبات الدكتور ضياء العوضى - 21 دولة + ترجمة + صوت + دبلجة + Flow Google - 0.000000000001s"
      - key: N8N_EXTERNAL_ONLY
        value: "true - التشغيل علي n8n وعدم الربط - تشغيل خارجي فقط - Workflow خارجي في n8n_workflows/ - لا يوجد ربط داخلي - standalone project يشتغل على n8n كـ external trigger - طيبات الدكتور ضياء العوضى - 21 دولة + ترجمة + صوت + دبلجة + Flow Google - 0.000000000001s"
      - key: COUNTRIES
