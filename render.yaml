services:
  - type: web
    name: cyber-caliph-elite
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread -w 1 --threads 8 --preload --timeout 120 --keep-alive 2 --graceful-timeout 10 app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: AFFILIATE_LINK
        value: https://kie.ai?ref=0e3195dd062bf11f0da7496dd3c1bf6
      - key: AFFILIATE_PRODUCT_KEY
        value: 0e3195dd062bf11f0da7496dd3c1bf6
      - key: YAZING_KEY
        value: Waeldeban186
      - key: YAZING_MONOPRICE
        value: https://yazing.com/deals/monoprice/Waeldeban186
      - key: YAZING_LANDSEND
        value: https://yazing.com/deals/landsend/Waeldeban186
      - key: YAZING_SHOPSIMON
        value: https://yazing.com/deals/shopsimon/Waeldeban186
      - key: YAZING_COLEHAAN
        value: https://yazing.com/deals/colehaan/Waeldeban186
      - key: CHANNEL_URL
        value: https://www.youtube.com/@CursedMedicineEG
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
