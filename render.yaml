services:
  - type: web
    name: cyber-caliph-elite
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread -w 1 --threads 25 --preload --timeout 300 --keep-alive 5 --graceful-timeout 10 --max-requests 2000 app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHANNEL_URL
        value: https://www.youtube.com/@CursedMedicineEG
