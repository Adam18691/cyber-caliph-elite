services:
  - type: web
    name: cyber-caliph-elite
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread -w 1 --threads 4 app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: AFFILIATE_LINK
        value: https://kie.ai?ref=0e3195dd062bf11f0da7496dd3c1bf6
      - key: PYTHON_VERSION
        value: 3.11.9
