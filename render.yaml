services:
  - type: web
    name: cyber-caliph-elite
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --worker-class gthread -w 1 --threads 100 --preload --timeout 30 --keep-alive 5 --graceful-timeout 2 --max-requests 10000 app:app --bind 0.0.0.0:$PORT --worker-tmp-dir /dev/shm --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TOPIC_MAIN
        value: "طيبات الدكتور ضياء العوضى - حذف جميع المواضيع واضافة موضوع طيبات الدكتور ضياء العوضى - نظام الطيبات - المسموح والممنوع - خبز - لحوم - فواكه - علاج طبيعي - قصص شفاء - وجبات يومية"
