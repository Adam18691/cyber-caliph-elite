# الجدولة التلقائية
auto_download_schedules:
  - "24h"
  - "3d"
  - "5d"
  - "10d"
  - "20d"
  - "30d"

# حالة الاتصال - يبان ✅ متصل فعلي أو ❌
connection_status:
  youtube: { icon: "❌", check: "real_api" }
  groq: { icon: "❌", check: "real_api" }
  ollama: { icon: "⏳", check: "local" }

# كود للنسخ
code_copy:
  enabled: true
  every_button: "📋 نسخ - كود للنسخ"
  user_select: "all"

# Self-Updating
self_updating:
  watch_list: ["torch", "transformers", "diffusers", "ollama", "comfyui", "coqui-tts", "whisper", "groq", "google-api-python-client"]
  check_interval: 3600
  sandbox: "/tmp/black_box_sandbox"
  atomic_swap: true
  rollback: true

